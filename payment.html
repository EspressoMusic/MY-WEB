<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Picasow — תשלום</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Heebo", sans-serif;
      background: #f3f4f6;
      color: #111827;
    }
    .payment-card {
      width: min(92vw, 620px);
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 22px 50px rgba(15, 23, 42, 0.18);
      border: 1px solid rgba(15, 23, 42, 0.08);
      padding: 1.4rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
    }
    p {
      margin: 0 0 1.2rem;
      font-size: 1.1rem;
      color: #4b5563;
    }
    .back-link {
      display: inline-block;
      text-decoration: none;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      color: #fff;
      font-weight: 700;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
    }
  </style>
</head>
<body>
  <main class="payment-card">
    <h1>תשלום</h1>
    <p>הגעתם לדף התשלום. כאן ניתן להשלים את ההזמנה בצורה מאובטחת.</p>
    <a href="index.html" class="back-link">חזרה לאתר</a>
  </main>
</body>
</html>
